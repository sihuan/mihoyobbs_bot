# mysbot 配置示例
# 复制为 config.toml 后填写；config.toml 已在 .gitignore 中

[telegram]
# @BotFather 创建的 bot token
token = "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
# 可执行 /on /off /push 等管理命令的用户 id（可多个）
admins = [123456789]
# 推送目标：私聊填用户 id，群/频道填 -100xxxxxxxxxx
chats = [-1001234567890]

[push]
# 兜底轮询间隔（秒）
poll_interval_secs = 120
# 每个 (游戏,类型) 每次抓取条数
page_size = 10
# 两次 API 请求之间的最小间隔（毫秒）——该 API 对突发请求会软限流
pace_ms = 2500
# 连续失败时的最大退避（秒）
max_backoff_secs = 1800

[activities]
# 活动到期预警总开关
enabled = true
# 剩余天数 <= 该值时提醒
alert_days = 3
# 每天几点检查（本地时区 UTC+8，0-23）
alert_hour = 10

# gids: 1=崩坏三 2=原神 3=崩坏二 4=未定事件簿 6=崩坏：星穹铁道 8=绝区零
[games.2]
name = "原神"
# 首次开启哪些类型的推送：1=公告 2=活动 3=资讯（之后用 /on /off 调整）
types = [1, 3]
# 活动到期预警的默认开关（之后用 /on 原神 预警 调整）
activities = true
# 游戏公告 API 标识
ann_api = "hk4e"

[games.6]
name = "崩坏：星穹铁道"
types = [1]
activities = true
ann_api = "hkrpg"
